kind: LuaScript
apiVersion: api.ibm.com/v1
metadata:
  name: LuaScript-pre-introspect
  namespace: skt-commom
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
spec:
  source: "local request = context:get_message(\"request\")\r\n\r\nlocal authorization = request.headers:get(\"Authorization\") or \"\"\r\nlocal client_id = request.headers:get(\"client_id\") or \"\"\r\n\r\n-- Bearer token ��\r\nlocal token = authorization:match(\r\n    \"^[Bb][Ee][Aa][Rr][Ee][Rr]%s+(.+)$\"\r\n)\r\n\r\nif token == nil or token == \"\" then\r\n    error(\"Authorization Bearer token is missing\")\r\nend\r\n\r\nif client_id == \"\" then\r\n    error(\"client_id header is missing\")\r\nend\r\n\r\n-- application/x-www-form-urlencoded encoding\r\nlocal function form_encode(value)\r\n    return (value:gsub(\"([^%w%-_%.~])\", function(c)\r\n        return string.format(\"%%%02X\", string.byte(c))\r\n    end))\r\nend\r\n\r\nlocal body =\r\n    \"token=\" .. form_encode(token) ..\r\n    \"&client_id=\" .. form_encode(client_id) ..\r\n    \"&token_type_hint=access_token\"\r\n\r\n-- �� request| t,� J� �� message �1\r\nlocal introspectRequest =\r\n    context:create_message(\"introspectRequest\", true)\r\n\r\nintrospectRequest.headers:set(\r\n    \"Content-Type\",\r\n    \"application/x-www-form-urlencoded\"\r\n)\r\n\r\nintrospectRequest.body:write(body)"
